name: Build and Deploy to k3s

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gheop/iphr

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.GHEOP_SSH_KEY }}

      - name: known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H gheop.com >> ~/.ssh/known_hosts

      # Clé de déploiement bridée (ci-deploy-2) : côté gheop, seules ces deux
      # commandes passent (~/bin/ci-deploy-guard.sh). Les manifestes ne sont PAS
      # appliqués par la CI : les appliquer à la main quand ils changent.
      - name: Déploiement
        run: |
          ssh sib@gheop.com "kubectl --kubeconfig ~/.kube/config -n iphr set image deployment/iphr iphr=ghcr.io/gheop/iphr:${{ github.sha }}"
          ssh sib@gheop.com "kubectl --kubeconfig ~/.kube/config -n iphr rollout status deployment/iphr --timeout=180s"
