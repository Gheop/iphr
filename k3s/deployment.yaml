apiVersion: apps/v1
kind: Deployment
metadata:
  name: iphr
  namespace: iphr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iphr
  template:
    metadata:
      labels:
        app: iphr
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: iphr
          image: ghcr.io/gheop/iphr:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: iphr-app-secrets
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "256Mi", cpu: "500m" }
