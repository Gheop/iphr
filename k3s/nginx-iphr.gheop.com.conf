# Vhost nginx frontal (hôte gheop.com) : proxy public → NodePort du service iphr.
# À placer dans /etc/nginx/sites-enabled/ puis : sudo nginx -t && sudo systemctl reload nginx
# Le certificat est obtenu via : sudo certbot certonly --nginx -d iphr.gheop.com
server {
    server_name iphr.gheop.com;
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    server_name iphr.gheop.com;
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/iphr.gheop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iphr.gheop.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:30087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
